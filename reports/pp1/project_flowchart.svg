<text x="450" y="788" text-anchor="middle" fill="#333" font-size="10">Upload call → High/Medium/Low + confidence scores</text>

<!-- PP2 LABEL -->
<rect x="50" y="814" width="800" height="22" rx="4" fill="#E8F5E9"/>
<text x="450" y="830" text-anchor="middle" fill="#2E7D32" font-size="12" font-weight="bold">PP2 — PLANNED (deadline: end of August 2026)</text>

<!-- PP2 Steps -->
<rect x="50" y="848" width="380" height="60" rx="6" fill="#F1F8E9" stroke="#558B2F" stroke-width="1.5"/>
<text x="60" y="866" fill="#33691E" font-size="11" font-weight="bold">① Label ~867 remaining calls (~3 days)</text>
<text x="60" y="882" fill="#555" font-size="10">Manual labelling of all audio/ files</text>
<text x="60" y="896" fill="#555" font-size="10">Blind self-relabel subset → Cohen's Kappa reliability score</text>

<rect x="470" y="848" width="380" height="60" rx="6" fill="#F1F8E9" stroke="#558B2F" stroke-width="1.5"/>
<text x="480" y="866" fill="#33691E" font-size="11" font-weight="bold">② Speaker-Relative Pitch Normalisation</text>
<text x="480" y="882" fill="#555" font-size="10">Convert raw Hz → semitones relative to per-call median</text>
<text x="480" y="896" fill="#555" font-size="10">Removes gender/speaker bias · preserves distress signal</text>

<rect x="50" y="924" width="380" height="60" rx="6" fill="#F1F8E9" stroke="#558B2F" stroke-width="1.5"/>
<text x="60" y="942" fill="#33691E" font-size="11" font-weight="bold">③ Probability Calibration</text>
<text x="60" y="958" fill="#555" font-size="10">Add CalibratedClassifierCV (Platt/sigmoid)</text>
<text x="60" y="972" fill="#555" font-size="10">Confidence scores become meaningful probabilities</text>

<rect x="470" y="924" width="380" height="60" rx="6" fill="#F1F8E9" stroke="#558B2F" stroke-width="1.5"/>
<text x="480" y="942" fill="#33691E" font-size="11" font-weight="bold">④ Ablation Study + Permutation Importance</text>
<text x="480" y="958" fill="#555" font-size="10">Acoustic-only vs. Textual-only vs. Fused models</text>
<text x="480" y="972" fill="#555" font-size="10">Proves multimodal fusion earns its keep</text>

<rect x="50" y="1000" width="380" height="66" rx="6" fill="#FCE4EC" stroke="#C62828" stroke-width="1.5"/>
<text x="60" y="1018" fill="#B71C1C" font-size="11" font-weight="bold">⑤ Facebook MMS for Sinhala ASR</text>
<text x="60" y="1034" fill="#555" font-size="10">Replace Whisper with facebook/mms-1b-all for Sinhala</text>
<text x="60" y="1048" fill="#555" font-size="10">MMS trained on 1100+ languages incl. Sinhala</text>
<text x="60" y="1060" fill="#555" font-size="10">Fixes textual branch → all 4 languages fully supported</text>

<rect x="470" y="1000" width="380" height="66" rx="6" fill="#FCE4EC" stroke="#C62828" stroke-width="1.5"/>
<text x="480" y="1018" fill="#B71C1C" font-size="11" font-weight="bold">⑥ Frozen XLM-R Embeddings</text>
<text x="480" y="1034" fill="#555" font-size="10">Replace keyword count with 768-dim semantic vectors</text>
<text x="480" y="1048" fill="#555" font-size="10">XLM-R pretrained on 100 langs incl. Sinhala/Tamil</text>
<text x="480" y="1060" fill="#555" font-size="10">No fine-tuning (small dataset) · PCA if needed</text>

<rect x="200" y="1082" width="500" height="50" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
<text x="450" y="1102" text-anchor="middle" fill="#1B5E20" font-size="11" font-weight="bold">⑦ Final Week — Full Re-evaluation + Write-up</text>
<text x="450" y="1118" text-anchor="middle" fill="#555" font-size="10">Retrain on full dataset · compare PP1 vs PP2 results · prepare report</text>

