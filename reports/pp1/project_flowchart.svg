<text x="145" y="697" text-anchor="middle" fill="#1B3A6B" font-size="10" font-weight="bold">Macro F1: 0.38</text>
<text x="145" y="712" text-anchor="middle" fill="#555" font-size="9">High 0.52 · Med 0.38 · Low 0.25</text>

<rect x="240" y="682" width="150" height="38" rx="4" fill="white" stroke="#1B6CA8" stroke-width="1"/>
