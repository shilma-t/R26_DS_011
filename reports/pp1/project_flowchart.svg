<text x="485" y="712" text-anchor="middle" fill="#555" font-size="9">Tamil 0.43 · Sinhala 0.42</text>

<rect x="580" y="682" width="250" height="38" rx="4" fill="white" stroke="#1B6CA8" stroke-width="1"/>
<text x="705" y="697" text-anchor="middle" fill="#1B3A6B" font-size="10" font-weight="bold">TF-IDF Keyword Discovery</text>
<text x="705" y="712" text-anchor="middle" fill="#555" font-size="9">85% manual keywords never appeared → rebuilt</text>

<line x1="450" y1="732" x2="450" y2="752" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

