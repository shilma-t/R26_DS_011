<rect width="900" height="1400" fill="#F8F9FA"/>

<!-- Title -->
<rect x="50" y="16" width="800" height="44" rx="6" fill="#1B3A6B"/>
<text x="450" y="44" text-anchor="middle" fill="white" font-size="15" font-weight="bold">Emergency Call Urgency Classification — Complete System Flow</text>

<!-- PP1 LABEL -->
<rect x="50" y="72" width="800" height="22" rx="4" fill="#E3F0FB"/>
<text x="450" y="88" text-anchor="middle" fill="#1B6CA8" font-size="12" font-weight="bold">PP1 — COMPLETED</text>

<!-- ROW 1: DATA SOURCE -->
<rect x="50" y="106" width="240" height="64" rx="6" fill="#DCEEFB" stroke="#1B6CA8" stroke-width="1.5"/>
<text x="170" y="128" text-anchor="middle" fill="#1B3A6B" font-size="12" font-weight="bold">Raw Audio Files</text>
<text x="170" y="145" text-anchor="middle" fill="#333" font-size="10">~1000 .ogg calls in audio/</text>
<text x="170" y="158" text-anchor="middle" fill="#333" font-size="10">Sinhala · Tamil · English · Mixed</text>

<rect x="330" y="106" width="240" height="64" rx="6" fill="#DCEEFB" stroke="#1B6CA8" stroke-width="1.5"/>
<text x="450" y="128" text-anchor="middle" fill="#1B3A6B" font-size="12" font-weight="bold">Manual Labelling</text>
<text x="450" y="145" text-anchor="middle" fill="#333" font-size="10">Listened to each call personally</text>
<text x="450" y="158" text-anchor="middle" fill="#333" font-size="10">labels.csv → urgency · language · keywords_heard</text>

<rect x="610" y="106" width="240" height="64" rx="6" fill="#DCEEFB" stroke="#1B6CA8" stroke-width="1.5"/>
<text x="730" y="128" text-anchor="middle" fill="#1B3A6B" font-size="12" font-weight="bold">Labelled Dataset</text>
<text x="730" y="145" text-anchor="middle" fill="#333" font-size="10">130 calls labelled (PP1)</text>
<text x="730" y="158" text-anchor="middle" fill="#333" font-size="10">High: 57 · Medium: 44 · Low: 29</text>

<line x1="290" y1="138" x2="326" y2="138" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="570" y1="138" x2="606" y2="138" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="730" y1="170" x2="730" y2="192" stroke="#555" stroke-width="1.5"/>
<line x1="730" y1="192" x2="450" y2="192" stroke="#555" stroke-width="1.5"/>
<line x1="450" y1="192" x2="450" y2="204" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- PREPROCESSING -->
<rect x="280" y="204" width="340" height="74" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
<text x="450" y="224" text-anchor="middle" fill="#1B5E20" font-size="12" font-weight="bold">Preprocessing  (01_preprocess.py)</text>
<text x="450" y="241" text-anchor="middle" fill="#333" font-size="10">① Noise Reduction — noisereduce library</text>
<text x="450" y="255" text-anchor="middle" fill="#333" font-size="10">② Resample to 16kHz — standardise for Whisper + librosa</text>
<text x="450" y="269" text-anchor="middle" fill="#333" font-size="10">③ Silence Trimming — remove dead air</text>

<line x1="450" y1="278" x2="450" y2="298" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- FEATURE EXTRACTION HEADER -->
<rect x="150" y="298" width="600" height="24" rx="4" fill="#FFF3E0" stroke="#E65100" stroke-width="1"/>
<text x="450" y="315" text-anchor="middle" fill="#E65100" font-size="11" font-weight="bold">Feature Extraction  (02_extract_features.py) — 92 features total</text>

<line x1="310" y1="322" x2="270" y2="342" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="590" y1="322" x2="630" y2="342" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- Acoustic Branch -->
<rect x="50" y="342" width="380" height="130" rx="6" fill="#FFF8E1" stroke="#F9A825" stroke-width="1.5"/>
<text x="240" y="362" text-anchor="middle" fill="#E65100" font-size="12" font-weight="bold">Acoustic Branch  (88 features)</text>
<text x="240" y="378" text-anchor="middle" fill="#555" font-size="10" font-style="italic">Works for ALL languages — no transcription needed</text>
<text x="240" y="395" text-anchor="middle" fill="#333" font-size="10">MFCCs (40 coeff × mean+std = 80 features)</text>
<text x="240" y="410" text-anchor="middle" fill="#555" font-size="9">Shape of sound per frame → summarised across full call</text>
<text x="240" y="426" text-anchor="middle" fill="#333" font-size="10">Pitch mean + std · RMS Energy mean + std</text>
<text x="240" y="441" text-anchor="middle" fill="#333" font-size="10">Zero Crossing Rate · Spectral Centroid</text>
<text x="240" y="456" text-anchor="middle" fill="#333" font-size="10">Speaking Rate · Jitter</text>

<!-- Textual Branch -->
<rect x="470" y="342" width="380" height="130" rx="6" fill="#FCE4EC" stroke="#C62828" stroke-width="1.5"/>
<text x="660" y="362" text-anchor="middle" fill="#B71C1C" font-size="12" font-weight="bold">Textual Branch  (4 features)</text>
<text x="660" y="378" text-anchor="middle" fill="#555" font-size="10" font-style="italic">Whisper STT → transcript → NLP features</text>
<text x="660" y="395" text-anchor="middle" fill="#333" font-size="10">Keyword Count — from keywords_heard + TF-IDF</text>
<text x="660" y="410" text-anchor="middle" fill="#333" font-size="10">Word Count · Repetition Rate · Sentiment Polarity</text>
<text x="660" y="430" text-anchor="middle" fill="#C62828" font-size="10" font-weight="bold">⚠ Whisper fails on Sinhala</text>
<text x="660" y="446" text-anchor="middle" fill="#C62828" font-size="9">Outputs Arabic/Cyrillic → textual branch contributes nothing</text>
<text x="660" y="461" text-anchor="middle" fill="#C62828" font-size="9">Acoustic branch handles Sinhala independently</text>

<line x1="240" y1="472" x2="240" y2="492" stroke="#555" stroke-width="1.5"/>
<line x1="240" y1="492" x2="450" y2="492" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="660" y1="472" x2="660" y2="492" stroke="#555" stroke-width="1.5"/>
<line x1="660" y1="492" x2="452" y2="492" stroke="#555" stroke-width="1.5"/>

<!-- features.csv -->
<rect x="330" y="492" width="240" height="36" rx="6" fill="#E8EAF6" stroke="#3949AB" stroke-width="1.5"/>
<text x="450" y="510" text-anchor="middle" fill="#1A237E" font-size="11" font-weight="bold">features.csv</text>
<text x="450" y="523" text-anchor="middle" fill="#333" font-size="10">130 rows × 92 feature columns</text>

<line x1="450" y1="528" x2="450" y2="548" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- TRAINING -->
<rect x="200" y="548" width="500" height="84" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
<text x="450" y="568" text-anchor="middle" fill="#1B5E20" font-size="12" font-weight="bold">Model Training  (03_train.py)</text>
<text x="450" y="585" text-anchor="middle" fill="#333" font-size="10">Pipeline: StandardScaler → SMOTE → Random Forest (200 trees)</text>
<text x="450" y="600" text-anchor="middle" fill="#333" font-size="10">SMOTE: synthetically balances High/Medium/Low classes</text>
<text x="450" y="615" text-anchor="middle" fill="#333" font-size="10">Validation: 5-Fold Stratified Cross-Validation</text>
<text x="450" y="628" text-anchor="middle" fill="#555" font-size="9">Also tested: SVM (RBF) · Logistic Regression → RF most stable (std 0.092)</text>

<line x1="450" y1="632" x2="450" y2="652" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- RESULTS -->
<rect x="50" y="652" width="800" height="80" rx="6" fill="#E3F0FB" stroke="#1B6CA8" stroke-width="1.5"/>
<text x="450" y="672" text-anchor="middle" fill="#1B3A6B" font-size="12" font-weight="bold">Results &amp; Evaluation  (04_evaluate.py · 06–09_*.py)</text>

